# /etc/ipsec.conf - StrongSwan IPsec configuration file

config setup
    charondebug="ike 2, knl 2, cfg 2"

conn %default
    keyexchange=ikev2
    authby=secret
    ike=aes256-sha256-modp2048,aes128-sha256-modp2048!
    esp=aes256-sha256-modp2048,aes128-sha256-modp2048!
    dpdaction=clear
    dpddelay=30s
    rekey=no
    compress=no

# Site-to-site Verbindung zum Minikube-Client
conn minikube-tunnel
    keyexchange=ikev2
    auto=add             # Responder wartet, startet nicht selbst

    # Lokale Seite (Kali-VM, "Server")
    left=192.168.15.129         # IP der Kali-VM
    leftid=server.example.com    # muss zur "remote.id" im Client passen
    leftsubnet=10.244.1.17/32    # "remote_ts" aus Client-Sicht (Server-Subnetz)

    # Remote-Seite (Minikube-Node/Pod)
    right=0.0.0.0        # erreichbare IP deines Minikube-Hosts
    rightid=client.example.com   # "local.id" des Clients
    rightsubnet=10.244.2.17/32   # "local_ts" aus Client-Sicht

    # NAT-Traversal, falls NAT im Spiel ist
    dpdaction=clear
    dpddelay=30s
    fragmentation=yes
