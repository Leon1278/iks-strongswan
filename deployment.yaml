# ============================================
# IPsec-Server ConfigMap
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-server-config
  labels:
    app: ipsec-server
data:
  swanctl.conf: |
    connections {
      server-tunnel {
        version = 2
        proposals = aes256-sha256-modp2048,aes128-sha256-modp2048

        local {
          auth = psk
          id = server.example.com
        }
        remote {
          auth = psk
          id = client.example.com
        }

        children {
          server-child {
            local_ts  = 0.0.0.0/0
            remote_ts = 0.0.0.0/0
            esp_proposals = aes256-sha256-modp2048,aes128-sha256-modp2048
            start_action = trap
            dpd_action = restart
          }
        }
      }
    }
    secrets {
      ike-server-tunnel {
        id = client.example.com
        secret = "yWOMZrfcu15TQXdIRF7+7dFS7NUCGBWp"
      }
    }
---
# ============================================
# IPsec-Client ConfigMap
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-client-config
  labels:
    app: ipsec-client
data:
  swanctl.conf: |
    connections {
      client-tunnel {
        remote_addrs = 192.168.49.3
        version = 2
        proposals = aes256-sha256-modp2048,aes128-sha256-modp2048

        local {
          auth = psk
          id = client.example.com
        }
        remote {
          auth = psk
          id = server.example.com
        }

        children {
          client-child {
            local_ts  = 0.0.0.0/0
            remote_ts = 0.0.0.0/0
            esp_proposals = aes256-sha256-modp2048,aes128-sha256-modp2048
            start_action = trap
            dpd_action = restart
          }
        }
      }
    }
    secrets {
      ike-client-tunnel {
        id = client.example.com
        secret = "yWOMZrfcu15TQXdIRF7+7dFS7NUCGBWp"
      }
    }

---
# ============================================
# IPsec-Server Deployment (Port 501)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipsec-server
  labels:
    app: ipsec-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipsec-server
  template:
    metadata:
      labels:
        app: ipsec-server
    spec:
      nodeName: minikube-m02
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: create-dirs
        image: alpine:latest
        command: ["sh", "-c", "mkdir -p /run/xtables.lock /var/run/charon && chmod 777 /run/xtables.lock /var/run/charon"]
        volumeMounts:
        - name: xtables-lock
          mountPath: /run/xtables.lock
        - name: charon
          mountPath: /var/run/charon
      containers:
      - name: strongswan
        image: strongx509/strongswan:latest
        imagePullPolicy: Always
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN", "SYS_ADMIN"]
        command: ["/usr/libexec/ipsec/charon"]
        args: ["--use-syslog", "--debug-ike=4", "--debug-knl=4", "--debug-cfg=4", "--debug-net=4"]
        volumeMounts:
        - name: swanctl-config
          mountPath: /etc/swanctl/swanctl.conf
          subPath: swanctl.conf
        - name: xtables-lock
          mountPath: /run/xtables.lock
        - name: charon
          mountPath: /var/run/charon
        env:
        - name: TZ
          value: "Europe/Berlin"
      volumes:
      - name: swanctl-config
        configMap:
          name: ipsec-server-config
      - name: xtables-lock
        emptyDir: {}
      - name: charon
        emptyDir: {}

---
